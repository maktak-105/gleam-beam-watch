<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAM Watch GUI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BEAM Watch GUI</h1>
        
        <div class="input-section">
            <h2>監視対象の追加</h2>
            <input type="text" id="urlInput" class="url-input" placeholder="https://example.com">
            <button id="addButton" class="add-button">追加</button>
            <button id="refreshButton" class="refresh-button">今すぐチェック</button>
        </div>
        
        <div class="settings-section">
            <h2>設定</h2>
            <div class="setting-item">
                <label for="checkInterval">確認間隔:</label>
                <input type="number" id="checkInterval" class="interval-input" min="1" max="86400" value="300">
                <select id="intervalUnit" class="interval-unit">
                    <option value="seconds">秒</option>
                    <option value="minutes">分</option>
                    <option value="hours">時間</option>
                </select>
                <button id="saveSettings" class="save-settings-button">保存</button>
            </div>
        </div>
        
        <div id="targetsContainer">
            <!-- 監視対象一覧はJavaScriptで生成 -->
        </div>
        
        <div id="resultsContainer">
            <!-- 監視結果一覧はJavaScriptで生成 -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
